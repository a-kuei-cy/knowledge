button{font-family:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 40px}
/* title */
.title{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 8px;flex-wrap:wrap}
.title .logo{width:92px;height:auto;flex:none}
.title .ava{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);flex:none;background:#fff}
.title .ava.g{border-color:var(--pink)}.title .ava.b{border-color:var(--blue)}
.school{display:block;font-size:15px;font-weight:900;color:var(--teal);letter-spacing:2px;margin-bottom:2px}
.tbox{text-align:left}
.tag{display:inline-block;background:var(--teal-l);border:3px solid var(--ink);border-radius:999px;padding:0 16px;font-size:20px;font-weight:900;margin-bottom:4px}
.tbox h1{margin:0;font-size:clamp(36px,6.4vw,64px);line-height:1.1;letter-spacing:2px;font-weight:900;background:linear-gradient(transparent 62%,var(--yel) 62%);padding:0 6px}
.tbox h1 b{color:var(--blue)}.tbox h1 em{font-style:normal;color:var(--teal)}
.subt{text-align:center;font-weight:900;letter-spacing:4px;color:var(--soft);margin-bottom:22px}
/* panel */
.panel{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:var(--r);box-shadow:0 8px 0 var(--ink);padding:30px 28px 22px}
.panel::after{content:"";position:absolute;left:24px;right:24px;top:8px;height:6px;border-radius:99px;background:var(--rainbow);opacity:.85}
.panel>.ptag{position:absolute;top:-18px;left:30px;border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-weight:900;font-size:16px;color:#fff;background:var(--teal);z-index:1}
.frow{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;margin:12px 0}
@media(max-width:640px){.frow{grid-template-columns:1fr}}
.frow>label{font-weight:900}
.frow small{display:block;font-weight:500;color:var(--soft);font-size:13px}
body.inquiz .toolbar{display:none}
.inp{border:3px solid var(--ink);border-radius:14px;padding:8px 14px;font-family:inherit;font-size:18px;max-width:270px;width:100%;color:var(--ink);background:#fff}
.inp:focus{outline:none;border-color:var(--pink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);background:#fff;border-radius:14px;padding:5px 14px;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--ink);transition:transform .08s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.on{background:var(--teal-l)}
.chip.dom{border-style:dashed;box-shadow:none;font-weight:700}
.chip.dom.on{border-style:solid;background:var(--yel-l);box-shadow:0 4px 0 var(--ink);font-weight:900}
.chip.dom i{font-style:normal;font-size:12px;color:var(--soft);margin-left:4px}
.chip.sm{padding:3px 10px;font-size:14px}
.chip:disabled{opacity:.35;cursor:not-allowed}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:0 4px 0 var(--ink)}
.seg button{border:0;background:#fff;padding:6px 16px;font-weight:900;font-size:16px}
.seg button+button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--yel)}
.startrow{display:flex;align-items:center;gap:18px;margin-top:20px;flex-wrap:wrap}
.bigbtn{border:4px solid var(--ink);border-radius:999px;background:var(--yel);font-size:28px;font-weight:900;padding:10px 40px;box-shadow:0 7px 0 var(--ink)}
.bigbtn:disabled{background:#e9eef3;color:#a7b2bd;border-color:#c8c2b9;box-shadow:0 7px 0 #c8c2b9;cursor:not-allowed}
.bigbtn:not(:disabled):active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.keys{margin-top:20px;font-size:14px;font-weight:700;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.k{display:inline-block;border:2.5px solid var(--ink);border-radius:8px;padding:0 7px;font-size:13px;font-weight:900;margin-right:4px;background:#fff;min-width:24px;text-align:center}
.note{font-size:13px;color:var(--soft);margin-top:4px}
.toolbar{position:fixed;top:12px;right:14px;display:flex;gap:8px;z-index:30}
.ib{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;box-shadow:0 3px 0 var(--ink)}
.src{display:inline-block;font-size:13px;font-weight:900;border-radius:999px;padding:2px 10px;background:var(--yel-l);border:2px solid var(--ink)}
/* quiz */
#quiz{min-height:100vh;display:flex;flex-direction:column;padding:16px clamp(12px,3vw,40px) 12px}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:900}
.qbar .who{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px 2px 3px;display:inline-flex;align-items:center;gap:8px}
.qbar .who img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--ink)}
.qbar .mk{height:40px}
.qbar .dom{background:var(--teal-l);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.qbar .prog{flex:1;min-width:160px;height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--rainbow);transition:width .3s}
.qbar .num{font-size:20px}
.qbar .sc{background:var(--ok-l);border:3px solid var(--ink);border-radius:999px;padding:2px 12px}
.cd{position:fixed;top:14px;right:16px;width:96px;height:96px;border-radius:50%;background:var(--teal);border:5px solid var(--ink);display:grid;place-items:center;font-size:52px;font-weight:900;color:#fff;z-index:40;box-shadow:0 5px 0 var(--ink)}
.cd.pop{animation:pop .25s}
.qbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(18px,3vh,36px);padding:clamp(10px,3vh,30px) 0}
.qtext{background:#fff;border:5px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);padding:clamp(18px,3.5vh,40px) clamp(18px,3vw,44px);text-align:center;font-size:clamp(30px,4.8vw,64px);font-weight:900;line-height:1.3;position:relative}
.qtext .qn{position:absolute;top:-22px;left:30px;background:var(--yel);border:4px solid var(--ink);border-radius:999px;padding:0 18px;font-size:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,40px)}
.opt{position:relative;border:5px solid var(--ink);border-radius:28px;box-shadow:0 9px 0 var(--ink);min-height:clamp(120px,22vh,240px);font-size:clamp(28px,4.4vw,60px);font-weight:900;padding:18px 20px 18px;line-height:1.2;transition:transform .12s,background .2s}
.opt.L{background:var(--blue-l);border-radius:28px 10px 10px 40px}.opt.R{background:var(--yel-l);border-radius:10px 28px 40px 10px}
.opt.L .side{background:var(--blue);color:#fff}.opt.R .side{background:var(--yel)}
.opt .side{position:absolute;top:-20px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid var(--ink);border-radius:999px;padding:0 18px;font-size:22px}
.opt:hover{transform:translateY(-3px)}
.opt.correct{background:var(--ok-l);border-color:var(--ok);box-shadow:0 9px 0 #2b7d4b}
.opt.correct::after{content:"✓";position:absolute;right:16px;bottom:8px;font-size:.9em;color:var(--ok)}
.opt.dim{opacity:.38}
.opt.picked-wrong{background:var(--bad-l);border-color:var(--bad);box-shadow:0 9px 0 #a83a3e;opacity:1}
.opt.picked-wrong::after{content:"✗";position:absolute;right:16px;bottom:8px;font-size:.9em;color:var(--bad)}
.verdict{text-align:center;min-height:62px;font-size:clamp(22px,3vw,34px);font-weight:900}
.verdict .ok{color:var(--ok)}.verdict .bad{color:var(--bad)}
.verdict .ex{display:block;font-size:clamp(16px,2vw,22px);color:var(--soft);font-weight:700}
.qfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.nav{display:flex;gap:10px}
.btn{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:7px 16px;font-weight:900;font-size:17px;box-shadow:0 4px 0 var(--ink)}
.btn.pri{background:var(--yel)}
.btn.ok{background:var(--ok-l)}.btn.bad{background:var(--bad-l)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.hint{font-size:13px;color:var(--soft);font-weight:700}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(90,70,54,.5);display:grid;place-items:center;z-index:60;padding:16px}
.ovc{background:#fff;border:4px solid var(--ink);border-radius:26px;box-shadow:0 9px 0 var(--ink);padding:26px;max-width:560px;width:100%;max-height:92vh;overflow:auto;animation:pop .25s}
.ovc.wide{max-width:900px}
.ovc h3{margin:0 0 10px;font-size:26px}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 2px;font-weight:900;font-size:18px;line-height:1.1}
.cell small{display:block;font-size:11px;color:var(--soft);font-weight:700}
.cell.ok{background:var(--ok-l)}.cell.bad{background:var(--bad-l)}.cell.cur{outline:4px solid var(--pink);outline-offset:1px}
.fld{display:block;margin:10px 0}.fld>span{display:block;font-weight:900;margin-bottom:4px}
.fld .inp{max-width:none}
.msg{font-size:14px;font-weight:900;margin:6px 0}.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
/* result */
.res{text-align:center}
.stars{font-size:54px;letter-spacing:6px}
.res h2{font-size:clamp(32px,5vw,52px);margin:4px 0}
.reskids{width:min(240px,50vw);border-radius:20px;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);margin:6px auto 4px;display:block}
.resface{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--ink);margin:4px auto;display:block}
.score{font-size:clamp(60px,10vw,110px);font-weight:900;line-height:1;color:var(--blue);-webkit-text-stroke:3px var(--ink)}
.bars{max-width:620px;margin:18px auto;text-align:left}
.bar{display:grid;grid-template-columns:72px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-weight:900}
.bar .tr{height:20px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--teal)}
.wrongs{max-width:760px;margin:10px auto;text-align:left}
.wrongs li{margin:6px 0}

footer img{width:70px}

/* ================= 題庫：雲端 ================= */
async function api(params,body){if(!S.gas)throw new Error('尚未設定 GAS 網址');
  const url=S.gas+(params?(S.gas.includes('?')?'&':'?')+new URLSearchParams(params):'');
  const r=await fetch(url,body?{method:'POST',body:JSON.stringify(body)}:{});const j=await r.json();if(!j.ok)throw new Error(j.msg||'伺服器錯誤');return j}
function parseGrades(v){const s=String(v).replace(/[年級\s]/g,'');const out=new Set();
  s.split(/[,，、]/).forEach(p=>{const m=p.match(/^(\d)-(\d)$/);if(m){for(let g=+m[1];g<=+m[2];g++)out.add(g)}else if(/^\d$/.test(p))out.add(+p);
    else if(p==='低')[1,2].forEach(g=>out.add(g));else if(p==='中')[3,4].forEach(g=>out.add(g));else if(p==='高')[5,6].forEach(g=>out.add(g));else if(p==='全')[1,2,3,4,5,6].forEach(g=>out.add(g))});
  return[...out]}
async function loadCloud(){if(!S.gas){S.src='內建';renderSrc();return}
  $('#srcTag').textContent='雲端載入中…';
  try{const j=await api({action:'bank'});const rows=j.rows.map(r=>({grades:parseGrades(r.grade),d:String(r.domain).trim(),q:String(r.q),a:String(r.a),w:String(r.w),ex:String(r.ex||'')}))
      .filter(r=>r.grades.length&&DOMAINS.includes(r.d)&&r.q&&r.a&&r.w);
    if(rows.length){S.bank=rows;S.src=`雲端試算表（${rows.length} 題）`}else{S.bank=builtinBank();S.src='內建（試算表題庫是空的）'}}
  catch(e){S.bank=builtinBank();S.src='內建（雲端讀取失敗）'}
  renderSrc();renderSetup()}
function renderSrc(){$('#srcTag').textContent=S.src}

/* ================= 設定頁 ================= */
const poolFor=d=>S.bank.filter(q=>q.d===d&&q.grades.includes(S.grade));
function renderSetup(){
  $('#genderC').innerHTML=['男','女'].map(g=>`<button class="chip ${S.gender===g?'on':''}" data-g="${g}">${g}生</button>`).join('');
  $('#gradeC').innerHTML=GRADES.map((g,i)=>`<button class="chip ${S.grade===i+1?'on':''}" data-gr="${i+1}">${g}</button>`).join('');
  const counts=DOMAINS.map(poolFor).map(p=>p.length);
  $('#domC').innerHTML=DOMAINS.map((d,i)=>`<button class="chip dom ${S.doms.has(d)?'on':''}" data-d="${d}" ${counts[i]?'':'disabled'}>${d}<i>${counts[i]}</i></button>`).join('');
  const per=uniqCounts(counts);$('#domNote').textContent=per;
  const avail=[...S.doms].reduce((s,d)=>s+poolFor(d).length,0);
  $('#cntC').innerHTML=COUNTS.map(n=>`<button class="chip sm ${S.count===n?'on':''}" data-c="${n}">${n} 題</button>`).join('');
  document.querySelectorAll('#orderS button').forEach(b=>b.classList.toggle('on',b.dataset.o===S.order));
  const ok=S.doms.size>0&&avail>0;$('#startBtn').disabled=!ok;
  $('#startHint').textContent=!S.doms.size?'請至少選一個領域':avail<S.count?`目前題庫共 ${avail} 題，將出 ${avail} 題`:`將出 ${S.count} 題`;
  drawDoc();
  $('#genderC').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.gender=b.dataset.g;savePrefs();renderSetup()});
  $('#gradeC').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.grade=+b.dataset.gr;[...S.doms].forEach(d=>{if(!poolFor(d).length)S.doms.delete(d)});savePrefs();renderSetup()});
  $('#domC').querySelectorAll('button').forEach(b=>b.onclick=()=>{const d=b.dataset.d;S.doms.has(d)?S.doms.delete(d):S.doms.add(d);savePrefs();renderSetup()});
  $('#cntC').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.count=+b.dataset.c;savePrefs();renderSetup()});
}
function uniqCounts(c){const nz=c.filter(Boolean);if(!nz.length)return'';const mn=Math.min(...nz),mx=Math.max(...nz);return mn===mx?`每個領域各 ${mn} 題`:`每個領域 ${mn}～${mx} 題`}
document.querySelectorAll('#orderS button').forEach(b=>b.onclick=()=>{S.order=b.dataset.o;savePrefs();renderSetup()});
$('#allBtn').onclick=()=>{DOMAINS.forEach(d=>{if(poolFor(d).length)S.doms.add(d)});savePrefs();renderSetup()};
$('#noneBtn').onclick=()=>{S.doms.clear();savePrefs();renderSetup()};
$('#name').addEventListener('input',savePrefs);

/* ================= 出題 ================= */
function buildQs(){const doms=DOMAINS.filter(d=>S.doms.has(d));const pools=doms.map(d=>shuffle(poolFor(d)));let list=[];
  if(S.order==='rr'){let k=0;while(list.length<S.count&&pools.some(p=>p.length)){const p=pools[k%pools.length];if(p.length)list.push(p.pop());k++}}
  else{list=shuffle(pools.flat()).slice(0,S.count)}
  return list.map(q=>{const left=Math.random()<.5;return{...q,opts:left?[q.a,q.w]:[q.w,q.a],ans:left?0:1,res:null,pick:null}})}
function start(){if(!$('#name').value.trim()){toast('請先輸入名字或班級');$('#name').focus();return}
  savePrefs();S.qs=buildQs();S.i=0;S.t0=Date.now();
  $('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');
  document.body.classList.add('inquiz');$('#qWho').innerHTML=`<img src="${FACE[S.gender]}" alt="">${esc($('#name').value.trim())}｜${GRADES[S.grade-1]}`;show()}
$('#startBtn').onclick=start;

/* ================= 作答頁 ================= */
function speak(t){if(!t)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';const vs=speechSynthesis.getVoices();const v=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch(e){}
const sayQ=q=>speak(`${q.q.replace(/_+/g,'空格')}　左邊，${q.opts[0]}。右邊，${q.opts[1]}。`);
let AC;function beep(f,d=.18,type='sine',v=.15){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const yay=()=>{beep(660,.15);setTimeout(()=>beep(990,.25),120)},boo=()=>beep(170,.35,'square',.07);
function show(){stopCd();const q=S.qs[S.i],n=S.qs.length;
  $('#qN').textContent=`第 ${S.i+1} 題`;$('#qT').textContent=q.q;$('#qDom').textContent=q.d;$('#qNum').textContent=`${S.i+1} / ${n}`;
  $('#qProg').style.width=(S.i+1)/n*100+'%';
  document.querySelectorAll('.opt').forEach((b,k)=>{b.querySelector('.t').textContent=q.opts[k]});
  paint();$('#nextBtn').textContent=S.i===n-1?'看成績 →':'下一題 →';
  if(S.tts)sayQ(q)}
function paint(){const q=S.qs[S.i];const right=S.qs.filter(x=>x.res===true).length,done=S.qs.filter(x=>x.res!==null).length;
  $('#qSc').textContent=`⭕ ${right}　❌ ${done-right}`;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.className='opt '+(k?'R':'L');
    if(q.res!==null){if(k===q.ans)b.classList.add('correct');else if(q.pick===k)b.classList.add('picked-wrong');else b.classList.add('dim')}});
  $('#verdict').innerHTML=q.res===null?'':`<span class="${q.res?'ok':'bad'}">${q.res?'⭕ 答對了！':'❌ 答錯了！'}</span>　正確答案：${esc(q.a)}${q.ex?`<span class="ex">💡 ${esc(q.ex)}</span>`:''}`}
function judge(res,pick=null){const q=S.qs[S.i];q.res=res;q.pick=pick;res?yay():boo();if(res)burst(18);paint();stopCd()}
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.s,q=S.qs[S.i];judge(k===q.ans,k)});
function next(){if(S.i<S.qs.length-1){S.i++;show()}else finish()}
function prev(){if(S.i>0){S.i--;show()}}
/* 倒數 */
function stopCd(){if(S.cdT){clearInterval(S.cdT);S.cdT=null}const c=$('.cd');if(c)c.remove()}
function countdown(){stopCd();let n=5;const c=document.createElement('div');c.className='cd';document.body.appendChild(c);
  const tickF=()=>{c.textContent=n;c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');beep(n?880:440,n?.1:.6,'triangle',.15);
    if(n===0){clearInterval(S.cdT);S.cdT=null;c.textContent='⏰';setTimeout(()=>c.remove(),1500)}n--};tickF();S.cdT=setInterval(tickF,1000)}
/* 總覽 */

document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const k=e.key;
  if(k==='f'||k==='F'){e.preventDefault();fs();return}
  const ov=$('.ov');if(ov){if(k==='Escape'||k==='l'||k==='L')ov.remove();return}
  if($('#quiz').classList.contains('hidden'))return;
  if(['ArrowRight',' ','PageDown','Enter'].includes(k)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prev()}
  else if(k==='o'||k==='O')judge(true);else if(k==='x'||k==='X')judge(false);
  else if(k==='r'||k==='R')sayQ(S.qs[S.i]);else if(k==='c'||k==='C')countdown();else if(k==='l'||k==='L')overview()});

function burst(n=40){const cs=['#2a5aa8','#f6c800','#3aa59a','#f08aa8','#e8483f'];for(let i=0;i<n;i++){const c=document.createElement('i');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cs[i%cs.length];c.style.animationDuration=1.4+Math.random()*1.6+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3400)}}

async function upload(p){const m=$('#upMsg');
  if(!S.gas){m.className='msg';m.textContent='（尚未設定試算表網址，成績未儲存。按右上 ⚙️ 設定）';return}
  m.className='msg';m.textContent='⏫ 成績寫入試算表中…';
  try{await api(null,{action:'submit',...p});m.className='msg ok';m.textContent='✅ 成績已寫入 Google 試算表'}
  catch(e){try{await fetch(S.gas,{method:'POST',mode:'no-cors',body:JSON.stringify({action:'submit',...p})});m.className='msg ok';m.textContent='✅ 成績已送出'}
    catch(e2){m.className='msg bad';m.textContent='⚠️ 寫入失敗：'+e.message}}}
async function records(){const ov=modal(`<h3>📊 最近紀錄</h3><div id="rcB">載入中…</div>`,'wide');
  if(!S.gas){ov.querySelector('#rcB').textContent='尚未設定試算表網址。';return}
  try{const j=await api({action:'records',limit:30});ov.querySelector('#rcB').innerHTML=j.rows.length?`<table style="width:100%;border-collapse:collapse;font-size:15px">${'<tr><th>時間</th><th>名字</th><th>年級</th><th>領域</th><th>答對</th><th>正確率</th></tr>'}${j.rows.map(r=>`<tr style="border-top:2px dashed #e0d6cc;text-align:center"><td>${esc(r.time)}</td><td>${esc(r.name)}</td><td>${esc(r.grade)}</td><td style="font-size:12px">${esc(r.doms)}</td><td>${esc(r.right)}/${esc(r.judged)}</td><td>${esc(r.pct)}%</td></tr>`).join('')}</table>`:'還沒有紀錄。'}
  catch(e){ov.querySelector('#rcB').textContent='讀取失敗：'+e.message}}
function home(){document.body.classList.remove('inquiz');$('#result').classList.add('hidden');$('#quiz').classList.add('hidden');$('#setup').classList.remove('hidden');renderSetup();window.scrollTo(0,0)}

  <p class="hint">試算表「題庫」工作表欄位：年級｜領域｜題目｜正確答案｜錯誤答案｜解說。年級可寫 5 或 5,6 或 5-6 或 低／中／高／全。左右位置會自動隨機。</p>
  <label class="fld"><span>管理密碼（Code.gs 裡的 ADMIN_KEY）</span><input class="inp" id="sKey" type="password" placeholder="寫入內建題庫時需要"></label>
  <div class="nav" style="flex-wrap:wrap"><button class="btn" id="sSeed">⬆️ 把內建 120 題寫入試算表</button><button class="btn" id="sCopy">📋 複製內建題庫（貼到試算表）</button></div>
  <p class="msg" id="sMsg2"></p>`,'wide');
  const m=ov.querySelector('#sMsg'),m2=ov.querySelector('#sMsg2');
  ov.querySelector('#sTest').onclick=async()=>{const o=S.gas;S.gas=ov.querySelector('#sGas').value.trim();m.className='msg';m.textContent='測試中…';
    try{const j=await api({action:'ping'});m.className='msg ok';m.textContent='✅ '+j.msg}catch(e){m.className='msg bad';m.textContent='❌ '+e.message}S.gas=o};
  ov.querySelector('#sSave').onclick=async()=>{S.gas=ov.querySelector('#sGas').value.trim();store.set('dq_gas',S.gas);ov.remove();await loadCloud();toast('題庫：'+S.src)};
  ov.querySelector('#sSeed').onclick=async()=>{const key=ov.querySelector('#sKey').value;S.gas=ov.querySelector('#sGas').value.trim()||S.gas;m2.className='msg';m2.textContent='寫入中…';
    try{const rows=builtinBank().map(q=>[q.grades.join(','),q.d,q.q,q.a,q.w,q.ex]);const j=await api(null,{action:'seed',key,rows});m2.className='msg ok';m2.textContent='✅ '+j.msg;await loadCloud()}
    catch(e){m2.className='msg bad';m2.textContent='❌ '+e.message}};
  ov.querySelector('#sCopy').onclick=()=>navigator.clipboard.writeText(bankTSV()).then(()=>toast('已複製，到試算表 A1 貼上'),()=>toast('無法複製'))};

/* ================= init ================= */
$('#name').value=prefs.name||'';$('#ttsBtn').textContent=$('#tBtn').textContent=S.tts?'🔊':'🔇';
$('#foot').textContent='嘉義市西區興嘉國民小學 Sing Chia Elementary School｜小博士知識大考驗 班級版';
renderSetup();renderSrc();loadCloud();
</script>
